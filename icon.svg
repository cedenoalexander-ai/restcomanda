<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#blueGrad)" />

  <!-- Inner subtle border glow -->
  <rect x="12" y="12" width="488" height="488" rx="102" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.35" />

  <!-- POS Terminal & Shopping Icon Group -->
  <g filter="url(#dropShadow)">
    <!-- POS Terminal Screen Body -->
    <rect x="116" y="104" width="280" height="240" rx="28" fill="#ffffff" />
    <rect x="136" y="124" width="240" height="130" rx="16" fill="#eff6ff" />

    <!-- Screen Graphics: Cart + Wave -->
    <path d="M176 160 h24 l18 48 h60 l14 -32 h-76" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="218" cy="226" r="8" fill="#2563eb" />
    <circle cx="268" cy="226" r="8" fill="#2563eb" />

    <!-- Screen Dollar Badge -->
    <circle cx="316" cy="156" r="22" fill="url(#amberGrad)" />
    <text x="316" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>

    <!-- Keypad Dots -->
    <circle cx="180" cy="290" r="10" fill="#93c5fd" />
    <circle cx="220" cy="290" r="10" fill="#93c5fd" />
    <circle cx="260" cy="290" r="10" fill="#93c5fd" />
    <circle cx="300" cy="290" r="10" fill="#3b82f6" />
    <circle cx="334" cy="290" r="10" fill="#10b981" />

    <!-- Stand / Base of the Register -->
    <path d="M206 344 L180 398 H332 L306 344 Z" fill="#dbeafe" />
    <rect x="146" y="398" width="220" height="20" rx="10" fill="#ffffff" />

    <!-- Receipt paper emitting from top -->
    <path d="M210 104 V78 H302 V104 Z" fill="#f8fafc" />
    <line x1="226" y1="88" x2="286" y2="88" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="226" y1="96" x2="266" y2="96" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- App Branding Pill at Bottom -->
  <g transform="translate(156, 434)">
    <rect width="200" height="42" rx="21" fill="#1e40af" />
    <text x="100" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">iMtec POS</text>
  </g>
</svg>
