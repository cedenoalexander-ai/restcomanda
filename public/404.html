<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>RestoComanda - Redirigiendo...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      // Single Page App redirect for GitHub Pages
      // When opening a deep link or subpath that triggers a 404 on GitHub Pages,
      // redirect back to the app root in this repository.
      (function() {
        var path = window.location.pathname;
        // Check repository folder segment (e.g. /my-restaurant-repo/)
        var segments = path.split('/').filter(Boolean);
        var target = './';
        if (segments.length > 0 && window.location.hostname.includes('github.io')) {
          target = '/' + segments[0] + '/';
        }
        window.location.replace(target);
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0a0a0a;
        color: #f4f4f5;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 4px solid #27272a;
        border-top: 4px solid #f59e0b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      a { color: #f59e0b; text-decoration: underline; }
    </style>
  </head>
  <body>
    <div>
      <div class="spinner"></div>
      <h2 style="margin: 0 0 8px; font-size: 18px;">Cargando RestoComanda...</h2>
      <p style="margin: 0; color: #a1a1aa; font-size: 13px;">Redirigiendo a la aplicación...</p>
      <p style="margin-top: 16px;"><a href="./">Haga clic aquí si no se redirige automáticamente</a></p>
    </div>
  </body>
</html>
